services:
  ota-http:
    image: nginx:1.27-alpine
    ports:
      - "18767:80"
    volumes:
      - ../firmware.bundle:/usr/share/nginx/html/firmware.bin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: "no"

  ota-tunnel:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://ota-http:80
    depends_on:
      - ota-http
    restart: "no"

