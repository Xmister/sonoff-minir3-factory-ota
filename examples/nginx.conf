server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    absolute_redirect off;

    location = /firmware.bin {
        root /usr/share/nginx/html;
        default_type application/octet-stream;
        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        return 404;
    }
}

